## Render.com Blueprint — Time's Hub | Attribution Intelligence
## Deploy: Dashboard > New > Blueprint > connect this repo
## Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: times-hub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_ADMIN_USER
        value: admin
      # Secrets are entered in the Render dashboard, never committed here.
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      # Persistent Postgres (e.g. Supabase session-pooler URI). Without it the
      # app falls back to SQLite on Render's ephemeral disk and loses all data
      # on every deploy/restart.
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: AUTH_TOKEN_EXPIRE_MINUTES
        value: "480"
